name: Bootstrap npm packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: npm-bootstrap-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Build npm CLI packages
        run: bun run build:npm-cli

      - name: Publish bootstrap packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          for package_dir in \
            packages/core \
            apps/opencode-plugin \
            packages/npm/quartz-darwin-arm64 \
            packages/npm/quartz-darwin-x64 \
            packages/npm/quartz-linux-arm64 \
            packages/npm/quartz-linux-x64 \
            packages/npm/quartz
          do
            spec="$(node -e "const p = require('./${package_dir}/package.json'); console.log(p.name + '@' + p.version)")"
            if npm view "${spec}" version >/dev/null 2>&1; then
              echo "Skipping already published ${spec}"
              continue
            fi

            echo "Publishing ${package_dir} as ${spec}"
            npm publish "./${package_dir}" --access public
          done
