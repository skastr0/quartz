name: Nightly TypeScript canary

on:
  schedule:
    # 06:15 UTC daily — isolated probe of typescript@next without bumping the pin
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc32391001b737086803440656603d044b78d0f # v2.0.1
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: "22"
      - name: Install repository pin
        run: bun install --frozen-lockfile
      - name: Run typescript@next canary
        run: bun scripts/nightly-canary.ts
