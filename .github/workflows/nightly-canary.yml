name: Nightly TypeScript canary

on:
  schedule:
    # 06:15 UTC daily — isolated probe of typescript@next without bumping the pin
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install repository pin
        run: bun install --frozen-lockfile
      - name: Run typescript@next canary
        run: bun scripts/nightly-canary.ts
