name: Nightly TypeScript canary

on:
  schedule:
    # 06:15 UTC daily — isolated probe of typescript@next without bumping the pin
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install repository pin
        run: bun install --frozen-lockfile
      - name: Run typescript@next canary
        run: bun scripts/nightly-canary.ts
