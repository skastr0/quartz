name: Release CLI binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release-binaries-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Build standalone CLI binaries
        run: bun run build:cli

      - name: Generate checksums
        working-directory: dist
        run: shasum -a 256 quartz-* > SHA256SUMS

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/quartz-* dist/SHA256SUMS --draft --generate-notes --verify-tag
