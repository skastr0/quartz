name: Release CLI binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release-binaries-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Validate release tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid release tag format: $TAG. Must start with 'v' and follow SemVer (e.g. v0.2.0)."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Build self-contained CLI release bundles
        run: bun run build:release-bundles

      - name: Verify extracted release bundle
        run: bun run verify:release-bundle

      - name: Generate checksums
        working-directory: dist
        run: shasum -a 256 quartz-*.tar.gz > SHA256SUMS

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/quartz-*.tar.gz dist/SHA256SUMS --draft --generate-notes --verify-tag
