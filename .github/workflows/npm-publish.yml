name: Publish npm packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: npm-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Build npm CLI packages
        run: bun run build:npm-cli

      - name: Inspect package contents
        run: |
          set -euo pipefail

          for package_dir in \
            packages/engine \
            apps/opencode-plugin \
            packages/npm/quartz-darwin-arm64 \
            packages/npm/quartz-darwin-x64 \
            packages/npm/quartz-linux-arm64 \
            packages/npm/quartz-linux-x64 \
            packages/npm/quartz
          do
            echo "Inspecting ${package_dir}"
            npm pack --dry-run "./${package_dir}"
          done

      - name: Publish packages
        run: |
          set -euo pipefail

          for package_dir in \
            packages/engine \
            apps/opencode-plugin \
            packages/npm/quartz-darwin-arm64 \
            packages/npm/quartz-darwin-x64 \
            packages/npm/quartz-linux-arm64 \
            packages/npm/quartz-linux-x64 \
            packages/npm/quartz
          do
            spec="$(node -e "const p = require('./${package_dir}/package.json'); console.log(p.name + '@' + p.version)")"
            if npm view "${spec}" version >/dev/null 2>&1; then
              echo "Skipping already published ${spec}"
              continue
            fi

            echo "Publishing ${package_dir} as ${spec}"
            npm publish "./${package_dir}" --access public
          done
